# Example configuration. Every key here is read by invoice_digitizer.config.settings,
# and every value matches the built-in default, so this file documents the options.
#
# Use it by pointing INVOICE_DIGITIZER_CONFIG_FILE at it (or at your own copy).
# Environment variables override it, for example:
#   INVOICE_DIGITIZER_MODEL__CONFIDENCE_THRESHOLD=0.5
#   INVOICE_DIGITIZER_API__ADMIN_API_KEY=...        # never put secrets in this file

environment: development   # development | staging | production
debug: false
log_level: INFO

model:
  hub_repo: "ultralytics/yolov5:v7.0"   # torch.hub repo pinned to a release tag
  hub_source: github                      # github | local (hub_repo is then a directory)
  weights_path: "models/invoice_fields.pt"
  allow_pretrained_fallback: false        # true = generic COCO weights; finds no invoice fields
  architecture: yolov5s                   # only used by the fallback
  confidence_threshold: 0.4
  iou_threshold: 0.45
  max_detections: 100
  image_size: 640
  device: auto                            # auto | cpu | cuda | mps
  half_precision: false                   # FP16, CUDA only
  preload: true                           # load at API start-up and fail fast
  classes:
    - "Invoice Date"
    - "Invoice Number"
    - "Vendor Name"
    - "Total Amount"
    - "VAT Amount"
    - "Line Item"

preprocessing:
  supported_formats: [".jpg", ".jpeg", ".png", ".tiff", ".tif", ".bmp", ".webp"]
  max_file_size_mb: 50
  max_image_dimension: 8192

api:
  host: "127.0.0.1"
  port: 8000
  rate_limit_enabled: true
  requests_per_minute: 60      # per client address, per process
  cors_allow_origins: []       # empty = CORS off
  max_batch_files: 20

monitoring:
  prometheus_enabled: true     # serves /metrics on the API port
