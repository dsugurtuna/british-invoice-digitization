# Local stack: the API, plus Prometheus scraping its /metrics endpoint.
# Not exercised in CI. Put trained weights in ./models first (see README).
#
#   docker compose up --build                        # API on http://localhost:8000
#   docker compose --profile monitoring up --build   # plus Prometheus on :9090

services:
  api:
    build: .
    image: british-invoice-digitization:latest
    ports:
      - "8000:8000"
    environment:
      INVOICE_DIGITIZER_MODEL__DEVICE: auto
      # Set to enable the admin endpoints (threshold changes, reload):
      # INVOICE_DIGITIZER_API__ADMIN_API_KEY: change-me
    volumes:
      - ./models:/app/models:ro

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
