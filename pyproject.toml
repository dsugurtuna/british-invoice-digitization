[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "british-invoice-digitization"
dynamic = ["version"]
description = "Invoice field detection with YOLOv5, served through a small FastAPI service."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ugur Tuna" }]
keywords = ["computer-vision", "yolov5", "document-ai", "invoice", "object-detection", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
requires-python = ">=3.11"
# Base install: only what this package's own code imports. The serving and
# pipeline logic runs (and is tested) without PyTorch.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings[yaml]>=2.3",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "numpy>=1.26",
    "pillow>=10.3",
]

[project.optional-dependencies]
# What the upstream YOLOv5 v7.0 code imports when torch.hub loads it
# (taken from that release's requirements.txt; opencv swapped for the
# headless build because a server has no display).
yolov5 = [
    "torch>=2.0",
    "torchvision>=0.15",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "tqdm>=4.64",
    "requests>=2.31",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "thop>=0.1.1",
    "ipython>=8.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/dsugurtuna/british-invoice-digitization"
Repository = "https://github.com/dsugurtuna/british-invoice-digitization.git"
Issues = "https://github.com/dsugurtuna/british-invoice-digitization/issues"
Changelog = "https://github.com/dsugurtuna/british-invoice-digitization/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "invoice_digitizer._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoice_digitizer = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "SIM", # simplify
    "PTH", # use pathlib
    "S",   # bandit security rules
    "DTZ", # timezone-aware datetimes
    "ARG", # unused arguments
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["invoice_digitizer"]
lines-between-types = 1

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest and coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["invoice_digitizer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
